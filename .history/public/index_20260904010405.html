<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante do Irmão</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Topo com Data/Hora e Header -->
    <div id="topo-info" style="position: absolute; top: 10px; left: 15px; font-size: 0.8rem; color: #fff;">
        <span id="data-hora-brasilia"></span>
    </div>

    <header>
        <h1>Restaurante do Irmão</h1>
        <p>O melhor da comida regional de Recife</p>
    </header>

    <!-- Botão Principal de Pedido -->
    <div class="container-acao">
        <button class="btn-pedido-destaque" onclick="abrirModalPedido()">Faça o Seu Pedido</button>
    </div>

    <!-- Área Onde o Cardápio em Grids Será Renderizado -->
    <main>
        <div id="cardapio-vitrine"></div>
    </main>

    <!-- Rodapé -->
    <footer style="text-align: center; padding: 20px; background: #8b4513; color: white; margin-top: 40px;">
        <h2>Preparamos tudo com muito carinho!</h2>
        <h3 style="margin: 10px 0;">Chave PIX: 55819920036280</h3>
        <h2>Venha almoçar conosco</h2>
        <p>Rua Vermelha, 02, Torre, Recife – PE</p>
        <a href="https://maps.google.com/?q=Rua+Vermelha,+02,+Torre,+Recife+-+PE" target="_blank" style="color: #ff8c00; text-decoration: underline; font-weight: bold;">Abrir Rota no Google Maps</a>
        <br><br>
        <button id="btn-gerenciar" onclick="abrirModalGerenciamento()" style="background: #ff8c00; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">
            Gerenciar ⚙️
        </button>
    </footer>

    <!-- Script Principal -->
    <script src="script.js"></script>
</body>
</html>
